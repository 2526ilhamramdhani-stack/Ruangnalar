name: RuangNalar CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Build static site
        run: npm run build
      - name: Check serverless API syntax
        run: |
          node --check api/content.js
          node --check api/generate-content.js
          node --check api/admin-auth.js
      - name: Verify key product invariants
        run: |
          node -e "const fs=require('fs'); const h=fs.readFileSync('index.html','utf8'); const checks=['matematika-wajib','matematika-lanjut','kimia','fisika','fiqih','id=\"contentSubject\"','id=\"saveAIDraft\"','id=\"publishAIDraft\"','examRemaining=isFormative?1800:2700']; for (const x of checks) { if (!h.includes(x)) throw new Error('Missing product invariant: '+x); } console.log('RuangNalar product invariants verified.');"
