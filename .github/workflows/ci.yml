name: RuangNalar CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Build static site
        run: npm run build
      - name: Check serverless API syntax
        run: |
          node --check api/content.js
          node --check api/generate-content.js
          node --check api/admin-auth.js
      - name: Verify key product invariants
        run: |
          node -e "const fs=require('fs'); const h=fs.readFileSync('index.html','utf8'); const checks=['matematika-wajib','matematika-lanjut','kimia','fisika','fiqih','id=\"contentSubject\"','id=\"saveAIDraft\"','id=\"publishAIDraft\"','examRemaining=isFormative?1800:2700','function applyMaterialSearch()','data-search-empty']; for (const x of checks) { if (!h.includes(x)) throw new Error('Missing product invariant: '+x); } const api=fs.readFileSync('api/content.js','utf8'); if (!api.includes('author_name')) throw new Error('Content API must include publisher names.'); for (const path of ['supabase/migrations/20261029000000_learning_contents.sql','supabase/migrations/20261029010000_subjects_and_drafts.sql','supabase/migrations/20261029020000_learning_content_author.sql','supabase/migrations/20261029030000_student_progress_handouts_archive.sql']) if (!fs.existsSync(path)) throw new Error('Missing required migration: '+path); const migration=fs.readFileSync('supabase/migrations/20261029030000_student_progress_handouts_archive.sql','utf8'); for (const x of ['student_profiles','learning_progress','handout_sections','archive_files','auth.uid()','source_references']) if (!migration.includes(x)) throw new Error('Missing student-data security invariant: '+x); console.log('RuangNalar product invariants, student-data security, and migration files verified.');"
